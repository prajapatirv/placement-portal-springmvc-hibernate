spring.application.name=placement-portal

# IDE-independent Supabase settings: one git-ignored file, config/supabase.properties (copy it from
# config/supabase.properties.example). It is read from the working directory, which is the project root in
# IntelliJ, VS Code, the terminal and start.cmd / start.sh. Without it, run with the "local" profile (H2).
spring.config.import=optional:file:./config/supabase.properties
spring.datasource.url=jdbc:postgresql://${supabase.host:}:${supabase.port:5432}/${supabase.database:postgres}?sslmode=${supabase.sslmode:require}
spring.datasource.username=${supabase.user:postgres}
spring.datasource.password=${supabase.password:}

# Flyway owns the schema; Hibernate only checks that it matches
spring.flyway.schemas=app
spring.flyway.default-schema=app
# If the schema was built by hand with database/04_manual_full_schema_and_seed.sql (tables exist, no history
# table), Flyway adopts it as version 3 instead of failing. On an empty schema this setting changes nothing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app

# No lazy loading in views: forces students to see LazyInitializationException and fix it properly
spring.jpa.open-in-view=false

# Show what Hibernate does (the heart of the N+1 demo)
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO

spring.thymeleaf.cache=false
spring.mvc.format.date=iso

# Demo switch: --demo.n-plus-one=true runs the 26-vs-1 query demo at startup
demo.n-plus-one=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
