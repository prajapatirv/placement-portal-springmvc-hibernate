<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h1 th:text="${heading}">Student</h1>
  <form method="post" th:action="@{${action}}" th:object="${form}" class="card">
    <div class="err" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Conflict</div>
    <div class="field"><label for="name">Name</label>
      <input id="name" th:field="*{name}">
      <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div></div>
    <div class="field"><label for="email">Email</label>
      <input id="email" th:field="*{email}">
      <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div></div>
    <div class="field"><label for="branch">Branch</label>
      <input id="branch" th:field="*{branch}" placeholder="CE, CS, IT, ITE">
      <div class="error" th:if="${#fields.hasErrors('branch')}" th:errors="*{branch}">Error</div></div>
    <div class="field"><label for="cgpa">CGPA (0 to 10)</label>
      <input id="cgpa" type="number" step="0.01" th:field="*{cgpa}">
      <div class="error" th:if="${#fields.hasErrors('cgpa')}" th:errors="*{cgpa}">Error</div></div>
    <button type="submit">Save</button>
    <a class="btn secondary" th:href="@{/students}">Cancel</a>
  </form>
</main>
</body>
</html>
