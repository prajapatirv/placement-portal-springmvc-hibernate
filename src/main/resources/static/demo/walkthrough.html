<style>

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 16px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px}

.btn:hover{border-color:var(--muted)}

.btn.primary{background:var(--ai);border-color:var(--ai);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#13101f}

select.sel{font-family:var(--font-body);font-size:.8rem;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;padding:8px 10px;max-width:100%}
.pickers{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 4px}
.picker{display:inline-flex;gap:8px;align-items:center}

/* nodes & edges */
.node rect{fill:var(--surface2);stroke:var(--border);stroke-width:1.5;transition:stroke .3s,stroke-width .3s,fill .3s}
.node{cursor:pointer;--kc:var(--muted)}
.node .title{font-size:14px;font-weight:600;fill:var(--fg);transition:fill .3s}
.node .sub{font-size:11.5px;fill:var(--muted)}
.k-data{--kc:var(--data);--ks:var(--data-soft)} .k-web{--kc:var(--web);--ks:var(--web-soft)} .k-ai{--kc:var(--ai);--ks:var(--ai-soft)}
.k-gold{--kc:var(--gold);--ks:var(--gold-soft)} .k-good{--kc:var(--good);--ks:var(--good-soft)} .k-bad{--kc:var(--bad);--ks:var(--bad-soft)} .k-muted{--kc:var(--muted);--ks:transparent}
.node[class*="k-"] rect{stroke:var(--kc)}
.node[class*="k-"] .title{fill:var(--kc)}
.node.k-muted rect{stroke-dasharray:4 4}
.node.k-bad rect{stroke-dasharray:4 3}
.node.seen rect{fill:var(--ks,var(--surface2))}
.node.on rect{stroke-width:2.8;fill:var(--ks,var(--surface2));filter:drop-shadow(0 0 7px var(--kc))}
.node.on{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
.node{transform-box:fill-box;transform-origin:center}
.zone{fill:none;stroke:var(--border);stroke-dasharray:5 5;stroke-width:1.3}
.zonelabel{font-size:11px;fill:var(--muted);letter-spacing:.06em}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.55;transition:stroke .3s,opacity .3s,stroke-width .3s}
.edge.dash{stroke-dasharray:5 4}
.edge[class*="k-"]{stroke:var(--kc)}
.edge.seen{opacity:.95}
.edge.live{opacity:1;stroke-width:2.6;stroke-dasharray:7 5;animation:flow .55s linear infinite;stroke:var(--kc,var(--ai))}
@keyframes flow{to{stroke-dashoffset:-12}}
.elabel{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.mk{fill:var(--muted)} .mk-ai{fill:var(--ai)} .mk-data{fill:var(--data)} .mk-web{fill:var(--web)} .mk-gold{fill:var(--gold)} .mk-good{fill:var(--good)} .mk-bad{fill:var(--bad)}
.pulse{fill:var(--kc,var(--ai));filter:drop-shadow(0 0 6px var(--kc,var(--ai)))}
.enter .node{animation:rise .5s both;animation-delay:calc(var(--i,0)*45ms)}
.enter .edge,.enter .elabel,.enter .zone,.enter .zonelabel{animation:fade .7s both;animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* console & code */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}

.pane{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:0}
.pane h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:8px 14px;font-family:var(--font-mono);font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border)}
.counter{font-size:.72rem;letter-spacing:0;text-transform:none;padding:2px 10px;border-radius:999px;border:1px solid var(--border);color:var(--fg)}
.counter.hot{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.counter.cool{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.counter.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
#console{height:222px;overflow:auto;padding:8px 12px;font-family:var(--font-mono);font-size:.74rem;line-height:1.55}
#console .ln{display:flex;gap:9px;animation:lnin .3s both;margin-bottom:3px}
@keyframes lnin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
#console .ln b{flex:none;width:44px;font-weight:500;font-size:.64rem;letter-spacing:.05em;padding-top:2px;color:var(--muted)}

.ln.sql b{color:var(--data)} .ln.java b{color:var(--web)} .ln.http b{color:var(--gold)} .ln.ai b{color:var(--ai)} .ln.ok b,.ln.ok span{color:var(--good)} .ln.bad b,.ln.bad span{color:var(--bad)}
.ln.sql span{color:var(--data)}

#info{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ai);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.84rem;min-height:48px}

#info .hint{color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:.8rem;min-width:620px}

tr:last-child td{border-bottom:0}

/* side steps */
.side{position:sticky;top:10px}
@media (max-width:980px){.side{position:static}}
.side h2{font-family:var(--font-display);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}

.steps li:hover{opacity:.9}
.steps li.done{opacity:.8;border-left-color:var(--muted)}
.steps li.cur{opacity:1;border-left-color:var(--ai);background:var(--ai-soft)}
.steps li b.n{display:block;font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ai);margin-bottom:2px}

.steps li.cur .say,.steps li.done .say{display:block}
.steps li.done .say{display:none}

.foot{margin-top:28px;color:var(--muted);font-size:.74rem;font-family:var(--font-mono)}
@media (prefers-reduced-motion:reduce){.node.on,.enter .node,.enter .edge{animation:none}.edge.live{animation:none}}
</style>
</head>

.pulse{fill:var(--kc,var(--ai));filter:drop-shadow(0 0 6px var(--kc,var(--ai)))}
.enter .node{animation:rise .5s both;animation-delay:calc(var(--i,0)*45ms)}
.enter .edge,.enter .elabel,.enter .zone,.enter .zonelabel{animation:fade .7s both;animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* console & code */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
@media (max-width:760px){.panes{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:0}
.pane h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:8px 14px;font-family:var(--font-mono);font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border)}
.counter{font-size:.72rem;letter-spacing:0;text-transform:none;padding:2px 10px;border-radius:999px;border:1px solid var(--border);color:var(--fg)}
.counter.hot{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.counter.cool{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.counter.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
#console{height:222px;overflow:auto;padding:8px 12px;font-family:var(--font-mono);font-size:.74rem;line-height:1.55}
#console .ln{display:flex;gap:9px;animation:lnin .3s both;margin-bottom:3px}
@keyframes lnin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
#console .ln b{flex:none;width:44px;font-weight:500;font-size:.64rem;letter-spacing:.05em;padding-top:2px;color:var(--muted)}
#console .ln span{min-width:0;overflow-wrap:anywhere}
.ln.sql b{color:var(--data)} .ln.java b{color:var(--web)} .ln.http b{color:var(--gold)} .ln.ai b{color:var(--ai)} .ln.ok b,.ln.ok span{color:var(--good)} .ln.bad b,.ln.bad span{color:var(--bad)}
.ln.sql span{color:var(--data)}
.empty{color:var(--muted);font-family:var(--font-body);font-size:.8rem;padding:6px 0}
#code{margin:0;height:222px;overflow:auto;padding:10px 14px;font-family:var(--font-mono);font-size:.74rem;line-height:1.55;white-space:pre;color:var(--fg)}
#code .c{color:var(--muted);font-style:italic} #code .s{color:var(--good)} #code .a{color:var(--ai)} #code .kw{color:var(--web)}

#info{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ai);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.84rem;min-height:48px}
#info b.t{font-family:var(--font-display);font-size:.8rem;display:block;margin-bottom:2px}
#info .hint{color:var(--muted)}

.tablewrap{margin-top:14px;overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.8rem;min-width:620px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td code,.lede code,.say code,#info code{font-family:var(--font-mono);font-size:.85em;background:var(--ai-soft);padding:1px 5px;border-radius:4px}

/* side steps */
.side{position:sticky;top:10px}
@media (max-width:980px){.side{position:static}}
.side h2{font-family:var(--font-display);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}
.steps{list-style:none;margin:0;padding:0;max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:980px){.steps{max-height:none}}
.steps li{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:0 9px 9px 0;padding:8px 11px;margin-bottom:7px;font-size:.8rem;line-height:1.45;cursor:pointer;opacity:.55;transition:opacity .25s,border-color .25s,background .25s}
.steps li:hover{opacity:.9}
.steps li.done{opacity:.8;border-left-color:var(--muted)}
.steps li.cur{opacity:1;border-left-color:var(--ai);background:var(--ai-soft)}
.steps li b.n{display:block;font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ai);margin-bottom:2px}
.steps li .say{display:none}
.steps li.cur .say,.steps li.done .say{display:block}
.steps li.done .say{display:none}

.foot{margin-top:28px;color:var(--muted);font-size:.74rem;font-family:var(--font-mono)}
@media (prefers-reduced-motion:reduce){.node.on,.enter .node,.enter .edge{animation:none}.edge.live{animation:none}}
</style>

<script>
function S(h, say, o) { o = o || {}; o.h = h; o.say = say; return o; }

window.META = {
  title: 'Spring MVC internals → the Campus Placement app',
  subtitle: 'Artifact 1 ended at the Hibernate layer. Here we walk <b>up</b> from it: what Spring MVC does with every HTTP request, how beans get wired — then the same pipeline carries the <b>five phases</b> of the placement portal, from publishing jobs to the JSON the AI assistant will use.',
  series: [
    { n: 1, label: 'ORM · Hibernate', href: '#part1' },
    { n: 2, label: 'Spring MVC · Placement app', cur: true },
    { n: 3, label: 'Gen AI', href: '#part3' }
  ],
  foot: 'PPSU Industry Expert Session · 5 Oct 2026 · Spring Boot 3 · Spring MVC · Thymeleaf · Hibernate 6 · PostgreSQL (Supabase)'
};

/* ---------- generic placement-phase pipeline ---------- */
var DEF = {
  req:   { hl: ['br'], go: [] },
  front: { hl: ['ds'], go: ['p1'] },
  ctrl:  { hl: ['ct'], go: ['p2'] },
  svc:   { hl: ['sv'], go: ['p3'] },
  repo:  { hl: ['rp'], go: ['p4'] },
  sql:   { hl: ['db'], go: ['p5'] },
  back:  { hl: ['sv', 'ct'], go: ['<p5', '<p4', '<p3'] },
  view:  { hl: ['vw'], go: ['p6'] },
  resp:  { hl: ['br'], go: ['p7'] }
};
function pipe(list) {
  return list.map(function (e) {
    var d = DEF[e.k] || {};
    var o = { hl: e.hl || d.hl, go: e.go || d.go, log: e.log, q: e.q, code: e.code, codeTitle: e.codeTitle, set: e.set, dwell: e.dwell };
    return S(e.h, e.say, o);
  });
}
function phase(c) {
  var nodes = [
    { id: 'br', x: 10, y: 40, w: 160, h: 72, t: 'Browser', s: c.n.br || '', k: 'web' },
    { id: 'ds', x: 200, y: 40, w: 160, h: 72, t: 'Dispatcher', s: 'Servlet · front\ncontroller', k: 'web' },
    { id: 'ct', x: 390, y: 40, w: 160, h: 72, t: c.n.ct[0], s: c.n.ct[1], k: 'web' },
    { id: 'sv', x: 580, y: 40, w: 160, h: 72, t: c.n.sv[0], s: c.n.sv[1], k: 'web' },
    { id: 'rp', x: 770, y: 40, w: 160, h: 72, t: c.n.rp[0], s: c.n.rp[1], k: 'data' },
    { id: 'db', x: 960, y: 40, w: 160, h: 72, t: 'PostgreSQL', s: c.n.db, k: 'data' },
    { id: 'vw', x: 390, y: 210, w: 160, h: 72, t: c.n.vw[0], s: c.n.vw[1], k: 'web' }
  ];
  if (c.ex) nodes.push({ id: 'ex', x: 580, y: 210, w: 540, h: 72, t: c.ex[0], s: c.ex[1], k: c.ex[2] });
  return {
    group: 'Campus placement phases', tab: c.tab, vb: [1130, 320], counter: true, counterHot: c.hot, counterCool: !!c.hot,
    lede: c.lede, pickers: c.pickers, nodes: nodes, info: c.info || {},
    zones: [{ x: 380, y: 12, w: 360, h: 116, label: 'web layer' }, { x: 760, y: 12, w: 370, h: 116, label: 'data layer · artifact 1' }],
    edges: [
      { id: 'p1', a: 'br.r', b: 'ds.l' }, { id: 'p2', a: 'ds.r', b: 'ct.l' }, { id: 'p3', a: 'ct.r', b: 'sv.l' },
      { id: 'p4', a: 'sv.r', b: 'rp.l', k: 'data' }, { id: 'p5', a: 'rp.r', b: 'db.l', k: 'data' },
      { id: 'p6', a: 'ct.b', b: 'vw.t', label: c.p6 || 'view name + Model', la: 'start', lo: [10, 4] },
      { id: 'p7', d: 'M390,246 L90,246 L90,112', label: 'response', lp: 0.45, lo: [0, -8] }
    ],
    build: function (p) { return pipe(c.s(p || {})).concat(c.after ? pipe(c.after(p || {})) : []); }
  };
}

window.SCENES = [

/* ================= 1 · SPRING MVC ARCHITECTURE ================= */
{
  group: 'How Spring MVC works', tab: 'Architecture', vb: [1100, 450], counter: true,
  lede: 'Every request enters through <b>one</b> servlet — the <b>DispatcherServlet</b> (front-controller pattern). It never does the work itself: it asks helpers who should handle the request, calls your controller, then asks another helper how to render the answer. Run it for <code>GET /jobs</code>.',
  nodes: [
    { id: 'cl', x: 20, y: 185, w: 140, h: 70, t: 'Browser', s: 'GET /jobs', k: 'web' },
    { id: 'ds', x: 400, y: 170, w: 220, h: 100, t: 'DispatcherServlet', s: 'front controller\nthe only entry point', k: 'web' },
    { id: 'hm', x: 400, y: 20, w: 220, h: 70, t: 'HandlerMapping', s: 'URL → controller method', k: 'web' },
    { id: 'ha', x: 680, y: 185, w: 160, h: 70, t: 'HandlerAdapter', s: 'calls the method', k: 'web' },
    { id: 'ct', x: 890, y: 185, w: 190, h: 70, t: '@Controller', s: 'JobController.list()', k: 'web' },
    { id: 'dt', x: 890, y: 340, w: 190, h: 80, t: 'Part 1 stack', s: 'Service → Repository\n→ Hibernate → DB', k: 'data' },
    { id: 'vr', x: 400, y: 340, w: 220, h: 70, t: 'ViewResolver', s: '"jobs/list" → template', k: 'web' },
    { id: 'vw', x: 150, y: 340, w: 190, h: 70, t: 'View (Thymeleaf)', s: 'model + template → HTML', k: 'web' }
  ],
  edges: [
    { id: 'r1', a: 'cl.r', b: 'ds.l', label: '1 request', lo: [0, -8] },
    { id: 'r2', a: 'ds.t', b: 'hm.b', label: '2 which handler?', la: 'start', lo: [12, 4] },
    { id: 'r3', a: 'ds.r', b: 'ha.l', label: '3', lo: [0, -8] },
    { id: 'r4', a: 'ha.r', b: 'ct.l', label: '4 call', lo: [0, -8] },
    { id: 'r5', a: 'ct.b', b: 'dt.t', k: 'data', label: '5 Part 1', la: 'start', lo: [10, 4] },
    { id: 'r6', d: 'M985,185 C985,105 570,105 570,170', label: '6 Model + view name', lp: 0.5, lo: [0, -8] },
    { id: 'r7', a: 'ds.b', b: 'vr.t', label: '7 resolve', la: 'start', lo: [10, 4] },
    { id: 'r8', a: 'vr.l', b: 'vw.r', label: '8 render', lo: [0, -8] },
    { id: 'r9', d: 'M150,375 L90,375 L90,255', label: '9 HTML', la: 'start', lo: [10, 14], lp: 0.8 }
  ],
  info: {
    cl: 'Any HTTP client. Spring MVC does not care whether it is a browser, curl, or a mobile app.',
    ds: 'The <b>front controller</b>. Spring Boot registers it automatically for <code>/</code>. Its <code>doDispatch()</code> method is the whole algorithm: find handler → invoke → render.',
    hm: 'Built at startup from your annotations: <code>GET /jobs → JobController#list</code>, <code>GET /jobs/{id}</code>, <code>POST /jobs/{id}/apply</code> … It also returns any interceptors for the route.',
    ha: 'Knows <i>how</i> to call an annotated method: resolves <code>@PathVariable</code>, <code>@RequestParam</code>, <code>@Valid @ModelAttribute</code>, the <code>Model</code> argument …',
    ct: 'Your code. Receives plain Java arguments, puts data into the <code>Model</code>, returns a <b>view name</b> string. It does not touch HttpServletRequest.',
    dt: 'Everything from artifact 1: <code>@Transactional</code> service → Spring Data repository → Hibernate → PostgreSQL.',
    vr: 'Turns the logical name <code>"jobs/list"</code> into <code>templates/jobs/list.html</code> (Thymeleaf resolver in this app).',
    vw: 'Combines the template with the Model: <code>th:each</code> loops over <code>jobs</code> and produces plain HTML.'
  },
  steps: [
    S('Request arrives', 'The browser sends <code>GET /jobs</code>. The servlet container (embedded Tomcat) hands it to the one servlet Spring registered.', { hl: ['cl', 'ds'], go: ['r1'], log: [['http', 'GET /jobs HTTP/1.1']] }),
    S('Who handles this?', 'DispatcherServlet asks <b>HandlerMapping</b>: which controller method owns <code>GET /jobs</code>? The answer is a handler plus any interceptors.', {
      hl: ['ds', 'hm'], go: ['r2'], log: [['java', 'RequestMappingHandlerMapping: GET /jobs → JobController#list']],
      codeTitle: 'built at startup', code: '// from your annotations\nGET   /jobs              -> JobController#list\nGET   /jobs/{id}         -> JobController#detail\nGET   /jobs/{id}/apply   -> JobController#form\nPOST  /jobs/{id}/apply   -> JobController#submit\nGET   /applications      -> list(slow?)\nGET   /api/jobs          -> JobApiController#all' }),
    S('Pick an adapter', 'It then asks a <b>HandlerAdapter</b> to invoke that handler. The adapter prepares the arguments.', { hl: ['ha'], go: ['r3'], log: [['java', 'RequestMappingHandlerAdapter.handle(…)']] }),
    S('Your controller runs', 'The adapter calls <code>list(model)</code>. This is the first line of <i>your</i> code in the whole request.', {
      hl: ['ct'], go: ['r4'], log: [['java', 'JobController.list(model)']],
      codeTitle: 'JobController.java', code: '@Controller\n@RequestMapping("/jobs")\npublic class JobController {\n    private final JobService jobs;\n    public JobController(JobService jobs) { this.jobs = jobs; }\n\n    @GetMapping\n    public String list(Model model) {\n        model.addAttribute("jobs", jobs.listOpenJobs());   // List<JobView>\n        return "jobs/list";                                // a view NAME, not HTML\n    }\n}' }),
    S('Down into Part 1', 'The controller calls the service, which calls the repository, which asks Hibernate — exactly the road from artifact 1.', {
      hl: ['dt'], go: ['r5'], q: 1, log: [['sql', 'select j.*, c.* from job_posting j join company c … where j.status = \'OPEN\' order by j.last_date']] }),
    S('Result goes into the Model', 'Rows come back up as <code>List&lt;JobView&gt;</code> records. The controller returns the string <code>"jobs/list"</code>. Spring packs the Model and that name into a <b>ModelAndView</b>.', {
      hl: ['ct'], go: ['<r5', 'r6'], log: [['java', 'ModelAndView(view="jobs/list", model={jobs=[12 items]})']] }),
    S('Resolve the view', 'Back in DispatcherServlet: <b>ViewResolver</b> maps the logical name to a real template file.', { hl: ['ds', 'vr'], go: ['r7'], log: [['java', 'ThymeleafViewResolver: "jobs/list" → templates/jobs/list.html']] }),
    S('Render', 'The <b>View</b> merges Model and template. In Thymeleaf, <code>th:each</code> repeats a table row per job.', {
      hl: ['vw'], go: ['r8'], log: [['java', 'th:each over jobs → 12 table rows']],
      codeTitle: 'templates/jobs/list.html', code: '<table>\n  <tr th:each="j : ${jobs}">\n    <td><a th:href="@{/jobs/{id}(id=${j.id})}" th:text="${j.title}">Title</a></td>\n    <td th:text="${j.company}">Company</td>\n    <td th:text="|${j.minLpa} to ${j.maxLpa} LPA|">Package</td>\n  </tr>\n</table>' }),
    S('Response', 'The HTML goes back through DispatcherServlet to the browser. <b>Debugger tip:</b> put a breakpoint in <code>DispatcherServlet.doDispatch</code> and step over <code>getHandler</code> → <code>handle</code> → <code>render</code>.', {
      hl: ['cl'], go: ['r9'], log: [['http', '200 OK  text/html'], ['ok', 'One request, one front controller, six helpers — you wrote only the controller and template.']] })
  ]
},

/* ================= 2 · BEANS & DI ================= */
{
  group: 'How Spring MVC works', tab: 'Beans · DI', vb: [1100, 420],
  lede: 'Controllers, services and repositories are <b>beans</b> — objects Spring creates and wires for you. Nobody writes <code>new JobService(...)</code> in the app. Press Run to watch the container build the graph <b>bottom-up</b>.',
  pickers: [{ id: 'mode', label: 'assistant.mode', def: 'mock', opts: [['mock', 'mock'], ['live', 'live']] }],
  zones: [{ x: 20, y: 10, w: 1060, h: 400, label: 'ApplicationContext — the IoC container' }],
  nodes: [
    { id: 'sc', x: 40, y: 48, w: 170, h: 64, t: 'Component scan', s: '@SpringBootApplication', k: 'muted' },
    { id: 'ct', x: 40, y: 170, w: 170, h: 80, t: 'Controllers', s: 'JobController\nAssistantController', k: 'web' },
    { id: 'sv', x: 250, y: 170, w: 170, h: 80, t: 'Services', s: 'JobService\nApplicationService', k: 'web' },
    { id: 'rp', x: 460, y: 170, w: 170, h: 80, t: 'Repositories', s: 'interfaces only\nSpring Data proxy', k: 'data' },
    { id: 'sf', x: 670, y: 170, w: 170, h: 80, t: 'SessionFactory', s: 'Hibernate +\nEntityManagerFactory', k: 'data' },
    { id: 'dsr', x: 880, y: 170, w: 170, h: 80, t: 'DataSource', s: 'HikariCP pool\napplication.properties', k: 'data' },
    { id: 'ai', x: 460, y: 320, w: 590, h: 66, t: 'AiClient bean', s: 'MockAiClient | ClaudeAiClient — picked by assistant.mode\ncontrollers depend on the interface only', k: 'ai' }
  ],
  edges: [
    { id: 'd0', a: 'sc.b', b: 'ct.t', dash: true, label: 'finds', la: 'start', lo: [10, 4] },
    { id: 'd1', a: 'ct.r', b: 'sv.l', label: 'needs', lo: [0, -8] }, { id: 'd2', a: 'sv.r', b: 'rp.l', label: 'needs', lo: [0, -8] },
    { id: 'd3', a: 'rp.r', b: 'sf.l', k: 'data', label: 'needs', lo: [0, -8] }, { id: 'd4', a: 'sf.r', b: 'dsr.l', k: 'data', label: 'needs', lo: [0, -8] },
    { id: 'da', d: 'M460,353 L125,353 L125,250', k: 'ai', dash: true, label: 'injected as AiClient', lp: 0.4, lo: [0, -8] }
  ],
  info: {
    sc: 'At startup Spring scans the package tree for <code>@Controller</code>, <code>@Service</code>, <code>@Repository</code>, <code>@Component</code> and registers each class as a bean definition.',
    ct: 'Depends on a service through its constructor. Spring passes the existing service bean in — the controller never creates it.',
    rp: 'You write only an interface (<code>extends JpaRepository</code>). Spring generates the implementation at runtime.',
    sf: 'Built once from the DataSource and your entity mappings; with <code>ddl-auto=validate</code> it also checks them against the schema.',
    dsr: 'The connection pool. Everything above depends on it, so it is created first.',
    ai: 'The same DI mechanism makes the AI swappable: the controller asks for the <code>AiClient</code> interface and the configured implementation arrives. That is why the demo can run offline in mock mode.'
  },
  build: function (p) {
    var live = p.mode === 'live';
    return [
      S('Component scan', 'Spring Boot scans your packages and finds every class carrying a stereotype annotation.', { hl: ['sc'], go: ['d0'], log: [['info', 'found: JobController, JobService, ApplicationService, JobRepository, … ']],
        codeTitle: 'stereotypes', code: '@Controller   // web layer\n@Service      // business logic\n@Repository   // data access (Spring Data does this for interfaces)\n@Component    // anything else\n\n// all four mean: "Spring, please create and manage this object"' }),
      S('1 · DataSource first', 'Dependencies are created before the things that need them. The connection pool has no dependencies, so it goes first.', { hl: ['dsr'], log: [['java', 'HikariDataSource created from spring.datasource.* properties']] }),

    var box = $('#pickers'); box.innerHTML = '';
    (sc.pickers || []).forEach(function (p) {
      if (st.pick[p.id] == null || !p.opts.some(function (o) { return o[0] === st.pick[p.id]; })) st.pick[p.id] = p.def != null ? p.def : p.opts[0][0];
      var w = h('span', 'picker', '', box);
      if (p.label) h('span', 'ctl-label', esc(p.label), w);
      if (p.type === 'select') {
        var s = h('select', 'sel', '', w);
        p.opts.forEach(function (o) { var op = h('option', '', esc(o[1]), s); op.value = o[0]; if (o[0] === st.pick[p.id]) op.selected = true; });
        s.addEventListener('change', function () { st.pick[p.id] = s.value; rebuildSteps(); });
      } else {
        var seg = h('div', 'seg', '', w);
        p.opts.forEach(function (o) {
          var b = h('button', '', esc(o[1]), seg); b.setAttribute('aria-pressed', o[0] === st.pick[p.id] ? 'true' : 'false');
          b.addEventListener('click', function () {
            st.pick[p.id] = o[0];
            Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            rebuildSteps();
          });
        });
      }
    });
  }
  function rebuildSteps() {
    stopPlay();
    var sc = SC[st.scene];
    st.steps = sc.build ? sc.build(st.pick) : sc.steps;
    var ol = $('#steps'); ol.innerHTML = '';
    st.steps.forEach(function (s, i) {
      var li = h('li', '', '<b class="n">' + (i + 1) + ' · ' + esc(s.h || 'Step') + '</b><div class="say">' + s.say + '</div>', ol);
      li.addEventListener('click', function () { jump(i, true); });
    });
    resetState();
    $('#bPlay').textContent = '▶ Run';
  }
  function renderTable(sc) {
    var w = $('#tablewrap');
    if (!sc.table) { w.hidden = true; w.innerHTML = ''; return; }
    var html = '<table><thead><tr>' + sc.table.head.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>' +
      sc.table.rows.map(function (r) { return '<tr>' + r.map(function (x) { return '<td>' + x + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
    w.innerHTML = html; w.hidden = false;
  }
  function loadScene(i) {
    stopPlay(); st.tok++;
    var first = !st.loaded;
    var wrap = [$('#lede'), $('#stage')];
    function go() {
      st.scene = i; st.loaded = true;
      var sc = SC[i];
      Array.prototype.forEach.call($('#tabs').querySelectorAll('button'), function (b, j) { b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
      $('#lede').innerHTML = sc.lede;
      $('#counter').hidden = !sc.counter;
      st.loop = !!sc.loop; var lb = $('#bLoop'); lb.classList.toggle('on', st.loop); lb.setAttribute('aria-pressed', st.loop);
      $('#info').innerHTML = '<span class="hint">Tip: click any box in the diagram to see what it does.</span>';
      renderDiagram(sc);
      buildPickers(sc);
      renderTable(sc);
      rebuildSteps();
      var svg = $('#stage');
      svg.classList.remove('enter'); void svg.offsetWidth; svg.classList.add('enter');
      wrap.forEach(function (w) { w.classList.remove('scene-out'); });
      try { history.replaceState(null, '', '#s' + (i + 1)); } catch (e) {}
      if (sc.autoplay) setTimeout(function () { if (st.scene === i && st.step < 0) play(); }, 700);
    }
    if (first || reduce) go();
    else { wrap.forEach(function (w) { w.classList.add('scene-out'); }); setTimeout(go, 230); }
  }

  /* ---------- wire up ---------- */
  buildHeader(); buildTabs();
  $('#bNext').addEventListener('click', function () { stopPlay(); next(); });
  $('#bPrev').addEventListener('click', prev);
  $('#bReset').addEventListener('click', function () { stopPlay(); resetState(); $('#bPlay').textContent = '▶ Run'; });
  $('#bPlay').addEventListener('click', function () { if (st.playing) stopPlay(); else play(); });
  $('#bLoop').addEventListener('click', function () { st.loop = !st.loop; this.setAttribute('aria-pressed', st.loop); this.classList.toggle('on', st.loop); });
  Array.prototype.forEach.call($('#speed').children, function (b) {
    b.addEventListener('click', function () {
      st.speed = parseFloat(b.dataset.s);
      Array.prototype.forEach.call($('#speed').children, function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
    });
  });
  document.addEventListener('keydown', function (e) {
    if (/INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ''))) return;
    if (e.key === 'ArrowRight') { stopPlay(); next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
    else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { if (st.playing) stopPlay(); else play(); e.preventDefault(); }
  });
  var start = 0, m = /#s(\d+)/.exec(location.hash || '');
  if (m && SC[parseInt(m[1], 10) - 1]) start = parseInt(m[1], 10) - 1;
  loadScene(start);
  if (window.parent !== window && window.ResizeObserver) {
    var lastH = 0;
    var post = function () { var hh = document.documentElement.scrollHeight; if (Math.abs(hh - lastH) > 2) { lastH = hh; try { parent.postMessage({ height: hh }, '*'); } catch (e) {} } };
    new ResizeObserver(post).observe(document.body); window.addEventListener('load', post);
  }
  window.__st = st; // handy for debugging in the console
})();

<\/script>
</body>
</html>
</script>

<script>
(function(){
  var f=document.getElementById('f'), btns=document.querySelectorAll('.bar button'), cur=0;
  function show(n){
    var t=document.getElementById('src'+n); if(!t) return;
    cur=n; f.srcdoc=t.textContent.replace(/<\\\/script>/g,'</'+'script>');
    btns.forEach(function(b){b.setAttribute('aria-selected', b.dataset.part==n?'true':'false');});
    try{history.replaceState(null,'','#part'+n);}catch(e){}
    window.scrollTo(0,0);
  }
  btns.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.part);});});
  window.addEventListener('message',function(e){
    if(e.source!==f.contentWindow) return;
    if(e.data&&e.data.height) f.style.height=e.data.height+'px';
    if(e.data&&e.data.part) show(e.data.part);
  });
  var m=/#part([123])/.exec(location.hash); show(m?m[1]:'1');
})();
</script>
</body>
