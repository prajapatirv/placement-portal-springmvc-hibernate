# Zero-account fallback: same Flyway scripts on in-memory H2 (PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:placement;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS app
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
